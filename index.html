<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星空塔羅</title>
<meta name="theme-color" content="#07061a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky"></canvas>
<svg id="lines"></svg>
<div id="slots"></div>
<div id="table"></div>
<div id="labels"></div>
<div id="gallery" hidden><div id="ring"></div><p class="gallery-hint">拖曳旋轉 · 點擊看牌</p></div>
<canvas id="fx"></canvas>

<header id="top">
  <div class="brand"><span class="en">Star Tarot</span><span class="zh">星空塔羅</span></div>
  <div class="seg" id="spreadPicker" role="tablist">
    <button data-spread="one">每日一牌</button>
    <button data-spread="theme" class="on">一大三小</button>
    <button data-spread="celtic">凱爾特十字</button>
  </div>
  <div class="tools">
    <button class="icon" id="historyBtn" title="占卜紀錄" aria-label="占卜紀錄"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.6C10 5.1 7 4.6 4 5.1v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-13c-3-.5-6 0-8 1.5zM12 6.6v13"/></svg></button>
    <button class="icon" id="galleryBtn" title="牌卡畫廊" aria-label="牌卡畫廊"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3.6" width="9.5" height="14.5" rx="1.6" transform="rotate(12 13.7 10.9)"/><rect x="5" y="5.6" width="9.5" height="14.5" rx="1.6" transform="rotate(-6 9.7 12.9)"/></svg></button>
    <button class="icon" id="soundBtn" title="音效" aria-label="音效"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.4L12 6v12l-4.6-3.5H4z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/></svg></button>
  </div>
</header>

<div id="intro">
  <div id="topicBox">
    <p class="label">想問哪個方面</p>
    <div id="topics" class="chips" aria-label="問題分類"></div>
  </div>
  <input id="question" maxlength="60" placeholder="在心中默念你的問題（可不填）" autocomplete="off">
  <button class="primary" id="shuffleBtn">✦ 洗牌</button>
  <p class="sub">點擊牌堆或按下洗牌 · 手機也可以搖一搖</p>
</div>

<p id="hint"></p>

<div id="actions" hidden>
  <button class="primary" id="readingBtn">📜 完整解讀</button>
  <button id="shareBtn">📤 存成圖片</button>
  <button id="againBtn">↻ 再抽一次</button>
</div>

<div id="tooltip" hidden></div>

<div id="modal" hidden>
  <div class="modal-body">
    <button class="close" aria-label="關閉">✕</button>
    <div class="modal-card"><div class="mcard"><img alt=""><div class="holo"></div><div class="glare"></div></div></div>
    <div class="modal-text"></div>
  </div>
</div>

<div id="sheet" hidden>
  <div class="sheet-body">
    <button class="close" aria-label="關閉">✕</button>
    <div class="sheet-content"></div>
  </div>
</div>

<div id="share" hidden>
  <div class="share-body">
    <button class="close" aria-label="關閉">✕</button>
    <img alt="占卜結果圖片">
    <p class="share-status"></p>
    <div class="share-actions">
      <button class="primary" data-act="native" hidden>分享</button>
      <button data-act="download">⬇ 下載圖片</button>
    </div>
  </div>
</div>

<script src="meanings.js"></script>
<script src="cards.js"></script>
<script src="reading.js"></script>
<script src="app.js"></script>
</body>
</html>
