<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星空塔羅</title>
<meta name="theme-color" content="#07061a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261109c">
</head>
<body>
<div id="aura"></div>
<canvas id="sky"></canvas>
<svg id="lines"></svg>
<div id="slots"></div>
<div id="table"></div>
<div id="ghosts"></div>
<div id="qLayer"><div class="q-dim"></div><div class="q-rays"></div></div>
<div id="labels"></div>
<div id="pickRing" hidden><div class="spin"></div></div>
<div id="gallery" hidden><div id="ring"></div><p class="gallery-hint">拖曳旋轉 · 點擊看牌</p></div>
<canvas id="fx"></canvas>
<div id="flash"></div>

<header id="top">
  <button class="brand" id="homeBtn" title="回到起始頁"><span class="en">Star Tarot</span><span class="zh">星空塔羅</span></button>
  <div id="spreadName"></div>
  <div class="tools">
    <button class="icon" id="historyBtn" title="占卜紀錄" aria-label="占卜紀錄"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.6C10 5.1 7 4.6 4 5.1v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-13c-3-.5-6 0-8 1.5zM12 6.6v13"/></svg></button>
    <button class="icon" id="galleryBtn" title="牌卡畫廊" aria-label="牌卡畫廊"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3.6" width="9.5" height="14.5" rx="1.6" transform="rotate(12 13.7 10.9)"/><rect x="5" y="5.6" width="9.5" height="14.5" rx="1.6" transform="rotate(-6 9.7 12.9)"/></svg></button>
    <button class="icon" id="soundBtn" title="音效" aria-label="音效"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.4L12 6v12l-4.6-3.5H4z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/></svg></button>
  </div>
</header>

<section id="home" class="screen">
  <div class="hero">
    <h1><span class="en">Ask the Stars</span><span class="zh">向星辰提問</span></h1>
  </div>
  <div class="orbit-wrap">
  <div id="orbit" aria-label="選擇情境">
    <svg class="orbit-path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <ellipse cx="50" cy="50" rx="42" ry="30" pathLength="100"/>
      <ellipse class="comet" cx="50" cy="50" rx="42" ry="30" pathLength="100"/>
    </svg>
    <div class="orbit-card"><div class="oc-face"></div></div>
    <button class="orb" data-scene="love"><span class="orb-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19.5s-7-4.3-7-9.4A3.9 3.9 0 0 1 12 7.7a3.9 3.9 0 0 1 7 2.4c0 5.1-7 9.4-7 9.4z"/></svg></span><span class="orb-name">感情</span></button>
    <button class="orb" data-scene="career"><span class="orb-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="8" width="16" height="11" rx="2"/><path d="M9 8V6.5A1.5 1.5 0 0 1 10.5 5h3A1.5 1.5 0 0 1 15 6.5V8M4 12.5h16"/></svg></span><span class="orb-name">事業</span></button>
    <button class="orb" data-scene="study"><span class="orb-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9 12 5l8.5 4L12 13z"/><path d="M7 11v4c1.5 1.4 3.2 2 5 2s3.5-.6 5-2v-4M20.5 9v5"/></svg></span><span class="orb-name">學業</span></button>
    <button class="orb" data-scene="self"><span class="orb-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20v-7"/><path d="M12 13c0-3.5-2.5-6-6.5-6 0 3.8 2.6 6 6.5 6zM12 13c0-3.5 2.5-6 6.5-6 0 3.8-2.6 6-6.5 6z"/></svg></span><span class="orb-name">自我成長</span></button>
    <button class="orb" data-scene="general"><span class="orb-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="10.5" r="6.5"/><path d="M7.5 17.5h9l1 2.5h-11z"/><path d="M9.5 8.5a3 3 0 0 1 2.5-1.5"/></svg></span><span class="orb-name">綜合</span></button>
  </div>
    <button class="orb side side-l" data-scene="daily"><span class="orb-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 6.5l1.4 3.6 3.6 1.4-3.6 1.4L12 16.5l-1.4-3.6L7 11.5l3.6-1.4z"/></svg></span><span class="orb-name">每日一牌</span><span class="orb-tag"></span></button>
    <button class="orb side side-r" data-scene="quick"><span class="orb-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="9" height="14" rx="1.5" transform="rotate(-10 10.5 12)"/><path d="M17.5 3.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8zM18 13l.5 1.2 1.2.5-1.2.5L18 16.4l-.5-1.2-1.2-.5 1.2-.5z"/></svg></span><span class="orb-name">隨手一抽</span><span class="orb-tag">要不要做？</span></button>
  </div>
  <div class="scene-info"><p class="scene-en"></p><h2></h2><p class="scene-sub"></p></div>
  <div id="homeBottom">
    <div id="qBox">
      <input id="question" maxlength="60" placeholder="在心中默念，或寫下你的問題" autocomplete="off">
      <button id="ideaBtn" type="button" title="換一個問題靈感">靈感</button>
    </div>
    <p class="daily-note">深呼吸，想著今天的自己</p>
    <div class="start-row">
      <button class="primary" id="startBtn"><span class="t">開始洗牌</span><span class="s"></span></button>
      <button id="spreadBtn" title="選擇牌陣" aria-label="選擇牌陣"></button>
    </div>
  </div>
</section>

<section id="quick" class="screen">
  <button class="back-link q-back">← 回到星空</button>
  <div class="q-head">
    <p class="scene-en">Quick Draw</p>
    <h2>隨手一抽</h2>
    <p class="scene-sub">心裡想著那件決定不了的事</p>
  </div>
  <div class="q-stage">
    <div class="case-wrap">
    <svg class="q-circle" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="96"/><circle cx="100" cy="100" r="86" class="thin"/><line x1="100" y1="4" x2="100" y2="11" transform="rotate(0 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(6 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(12 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(18 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(24 100 100)"/><line x1="100" y1="4" x2="100" y2="11" transform="rotate(30 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(36 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(42 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(48 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(54 100 100)"/><line x1="100" y1="4" x2="100" y2="11" transform="rotate(60 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(66 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(72 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(78 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(84 100 100)"/><line x1="100" y1="4" x2="100" y2="11" transform="rotate(90 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(96 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(102 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(108 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(114 100 100)"/><line x1="100" y1="4" x2="100" y2="11" transform="rotate(120 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(126 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(132 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(138 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(144 100 100)"/><line x1="100" y1="4" x2="100" y2="11" transform="rotate(150 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(156 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(162 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(168 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(174 100 100)"/><line x1="100" y1="4" x2="100" y2="11" transform="rotate(180 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(186 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(192 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(198 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(204 100 100)"/><line x1="100" y1="4" x2="100" y2="11" transform="rotate(210 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(216 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(222 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(228 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(234 100 100)"/><line x1="100" y1="4" x2="100" y2="11" transform="rotate(240 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(246 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(252 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(258 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(264 100 100)"/><line x1="100" y1="4" x2="100" y2="11" transform="rotate(270 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(276 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(282 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(288 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(294 100 100)"/><line x1="100" y1="4" x2="100" y2="11" transform="rotate(300 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(306 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(312 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(318 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(324 100 100)"/><line x1="100" y1="4" x2="100" y2="11" transform="rotate(330 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(336 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(342 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(348 100 100)"/><line x1="100" y1="7" x2="100" y2="11" transform="rotate(354 100 100)"/><circle cx="100" cy="100" r="78" class="thin"/><circle cx="178.0" cy="100.0" r="3"/><circle cx="167.5" cy="139.0" r="3"/><circle cx="139.0" cy="167.5" r="3"/><circle cx="100.0" cy="178.0" r="3"/><circle cx="61.0" cy="167.5" r="3"/><circle cx="32.5" cy="139.0" r="3"/><circle cx="22.0" cy="100.0" r="3"/><circle cx="32.5" cy="61.0" r="3"/><circle cx="61.0" cy="32.5" r="3"/><circle cx="100.0" cy="22.0" r="3"/><circle cx="139.0" cy="32.5" r="3"/><circle cx="167.5" cy="61.0" r="3"/><polygon points="100.0,36.0 155.4,132.0 44.6,132.0"/><polygon points="100.0,164.0 44.6,68.0 155.4,68.0"/><circle cx="100" cy="100" r="40" class="thin"/></svg>
    <div class="case" aria-label="從卡夾抽一張牌">
      <div class="case-light"></div>
      <div class="case-back"></div>
      <div class="case-cards"><span></span><span></span><span></span></div>
      <div class="peek"><div class="face back"></div></div>
      <div class="case-lid"><span class="lid-gem"></span></div>
      <div class="case-front">
        <span class="cf-c tl"></span><span class="cf-c tr"></span><span class="cf-c bl"></span><span class="cf-c br"></span>
        <span class="cf-moon"></span>
        <span class="cf-title">STAR TAROT</span>
        <span class="cf-sub">星 空 塔 羅</span>
      </div>
    </div>
    </div>
    <p class="q-hint">把牌往上拉出來，或輕點卡夾</p>
  </div>
  <div class="q-result" hidden>
    <p class="q-en"></p>
    <h2 class="q-verdict"></h2>
    <p class="q-line"></p>
    <p class="q-card"></p>
    <p class="q-advice"></p>
    <div class="q-actions">
      <button class="primary" data-q="again">再抽一張</button>
      <button data-q="detail">完整牌義</button>
      <button data-q="home">回到星空</button>
    </div>
  </div>
</section>

<div id="wheel" hidden>
  <button class="wheel-close" aria-label="關閉">✕</button>
  <p class="label wheel-title">Choose your spread</p>
  <div class="dial">
  </div>
  <div class="hub">
    <span class="hd"></span>
    <span class="hn"></span>
    <span class="hc"></span>
    <span class="hb"></span>
    <button class="hub-ok">選這個牌陣</button>
  </div>
  <p class="wheel-tip">轉動輪盤，或點選牌陣</p>
</div>

<p id="hint"></p>

<div id="revealBar" hidden><button class="primary" id="revealAllBtn">✦ 全部翻開</button></div>

<div id="actions" hidden>
  <button class="primary with-icon" id="readingBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7.5L19 8v12.5H7z"/><path d="M14.5 3.5V8H19M10 12h6M10 15.5h6"/></svg>完整解讀</button>
  <button class="with-icon" id="shareBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 7.5L12 3.5l4 4"/><path d="M6.5 11H5v9.5h14V11h-1.5"/></svg>存成圖片</button>
  <button class="with-icon" id="againBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19.5 4v4.5H15"/></svg>再抽一次</button>
</div>

<div id="tooltip" hidden></div>

<div id="modal" hidden>
  <div class="modal-body">
    <button class="close" aria-label="關閉">✕</button>
    <div class="modal-card"><div class="mcard"><img alt=""><div class="holo"></div><div class="glare"></div></div></div>
    <div class="modal-text"></div>
  </div>
</div>

<div id="sheet" hidden>
  <div class="sheet-body">
    <button class="close" aria-label="關閉">✕</button>
    <div class="sheet-content"></div>
  </div>
</div>

<div id="share" hidden>
  <div class="share-body">
    <button class="close" aria-label="關閉">✕</button>
    <img alt="占卜結果圖片">
    <p class="share-status"></p>
    <div class="share-actions">
      <button class="primary" data-act="native" hidden>分享</button>
      <button class="with-icon" data-act="download"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M8 11l4 4 4-4M5 19.5h14"/></svg>下載圖片</button>
    </div>
  </div>
</div>

<script src="meanings.js?v=20261109c"></script>
<script src="cards.js?v=20261109c"></script>
<script src="reading.js?v=20261109c"></script>
<script src="live.js?v=20261109c"></script>
<script src="app.js?v=20261109c"></script>
</body>
</html>
